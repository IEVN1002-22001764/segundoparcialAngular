<h2 class="text-2xl font-bold mb-4 text-white">Calcula tu horóscopo chino</h2>

<div class="flex flex-col md:flex-row gap-8 p-4">
  <div class="bg-emerald-200 border border-black p-4 rounded-lg w-full md:w-80 text-black">
    <h3 class="text-lg font-bold mb-3">Datos Personales</h3>

    <label class="block text-sm font-medium">Nombre: </label>
    <input type="text" [(ngModel)]="nombre" placeholder="Nombre" class="w-full p-1 mb-2 border rounded"><br>

    <label class="block text-sm font-medium">A. Paterno: </label>
    <input type="text" [(ngModel)]="apaterno" placeholder="Apaterno" class="w-full p-1 mb-2 border rounded"><br>

    <label class="block text-sm font-medium">A. Materno: </label>
    <input type="text" [(ngModel)]="amaterno" placeholder="Amaterno" class="w-full p-1 mb-2 border rounded"><br>

    <p class="font-bold mt-2">Fecha de nacimiento</p>
    <div class="flex gap-2 my-2">
      <input type="number" [(ngModel)]="dia" placeholder="Día" class="w-16 p-1 border rounded">
      <input type="number" [(ngModel)]="mes" placeholder="Mes" class="w-16 p-1 border rounded">
      <input type="number" [(ngModel)]="anio" placeholder="Año" class="w-20 p-1 border rounded">
    </div>

    <p class="font-bold my-2">Sexo</p>
    <label class="inline-flex items-center gap-1 mr-4">
      <input type="radio" name="sexo" value="Masculino" [(ngModel)]="sexo"> Masculino
    </label>
    <label class="inline-flex items-center gap-1">
      <input type="radio" name="sexo" value="Femenino" [(ngModel)]="sexo"> Femenino
    </label><br><br>

    <button (click)="calcular()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 w-full">Calcular</button>
  </div>

  @if (mostrarResultado) {
    <div class="bg-white p-6 rounded-lg shadow dark:bg-gray-800 dark:text-white">
      <h2 class="text-xl font-bold">Hola {{ nombreCompleto }}</h2>
      <h3 class="text-lg">Tienes {{ edad }} años</h3>
      <p class="mt-2">Tu signo zodiacal chino es: <strong>{{ signo }}</strong></p>
      <img [src]="imagenSigno" [alt]="signo" class="w-24 h-24 mt-4 object-contain">
    </div>
  }
</div>
