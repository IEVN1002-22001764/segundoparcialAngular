<div>
    <form [FormGroup]="formulario"
    <label class="block text-sm font-medium">Nombre: </label>
    <input type="text"  FormControlName="nombre" placeholder="Nombre"><br>

     <label class="block text-sm font-medium">Matricula: </label>
    <input type="text"  FormControlName="matricula" placeholder="Matricula"><br>

     <label class="block text-sm font-medium">Correo: </label>
    <input type="text" FormControlName="correo" placeholder="Correo"><br>

     <label class="block text-sm font-medium">Materia: </label>
    <input type="text" FormControlName="materia" placeholder="Materia"><br>

    <button type="button">Hacer clic</button>
    </form>
</div>
